<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Special Surprise For You ❤️</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <!-- Step 1: The Interactive Envelope -->
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="letter">
                    <p>To my beautiful, Hanī 💖</p>
                </div>
            </div>
            <p class="envelope-prompt">Click to Open</p>
        </div>

        
<!-- Step 2: Blooming Carnation & Romantic Message -->
<div class="flower-stage" id="flowerStage">
    <div class="carnation">
        <div class="carnation-bloom">
            <div class="ruffle ruffle-1"></div>
            <div class="ruffle ruffle-2"></div>
            <div class="ruffle ruffle-3"></div>
            <div class="ruffle ruffle-4"></div>
            <div class="ruffle ruffle-5"></div>
            <div class="ruffle ruffle-6"></div>
            <div class="ruffle ruffle-7"></div>
            <div class="ruffle ruffle-8"></div>
            <div class="ruffle ruffle-9"></div>
            <div class="carnation-center"></div>
        </div>

        <div class="stem">
            <div class="leaf left"></div>
            <div class="leaf right"></div>
        </div>
    </div>

    <div class="text-message">
        <span id="typing-text"></span>
        <span class="cursor">|</span>
    </div>
</div>

    </div>

    <script src="script.js"></script>
